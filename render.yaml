# Render Blueprint — free-remote-deployment target (Render free web service + Supabase
# PostgreSQL + Cloudflare R2 document storage). Prepared, NOT applied — creating the actual
# Render service/environment from this file is a separate, explicit action outside this
# task's scope (see docs/DEPLOYMENT_FREE.md "No cloud action" boundary).
#
# Single instance only (Render's free plan is single-instance by construction — no
# horizontal scaling option exists on it, which conveniently matches this project's current
# storage/rate-limit-state constraints; see docs/production/SECURITY_BASELINE.md "Storage").
#
# `sync: false` env vars are never written into this file or any commit — Render prompts
# for them once when the Blueprint is applied, and they're stored only in Render's own
# environment-variable store from that point on.

services:
  - name: abroad-scholarship-api # placeholder — rename to your actual Render service name
    type: web
    runtime: docker
    plan: free
    region: oregon # placeholder — pick the region closest to your Supabase project
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: commit # deploys on every push to the connected branch (see GitHub setup in docs/DEPLOYMENT_FREE.md)
    envVars:
      # --- APP ---
      - key: NODE_ENV
        value: production
      # Render injects PORT itself — do not set a value here; main.ts reads it automatically.
      - key: CORS_ALLOWED_ORIGINS
        sync: false # your real frontend origin(s), comma-separated — never "*"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "120"

      # --- DATABASE (Supabase) ---
      - key: DATABASE_URL
        sync: false # Supabase POOLED connection string (PgBouncer, port 6543)
      - key: DIRECT_URL
        sync: false # Supabase DIRECT connection string (port 5432) — used for migrations

      # --- AUTH ---
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: AUTH_REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: AUTH_LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: AUTH_LOCKOUT_MINUTES
        value: "15"
      - key: AUTH_PASSWORD_RESET_TTL_MINUTES
        value: "30"
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false # set once before the first deploy's seed step — see docs/DEPLOYMENT_FREE.md
      - key: AUTH_MFA_ENCRYPTION_KEY
        generateValue: true # Render generates a random value; confirm it's exactly 64 hex chars (32 bytes) — see docs/DEPLOYMENT_ENV.md if it needs regenerating
      - key: AUTH_MFA_ISSUER
        value: "Abroad Scholarship System"
      - key: AUTH_COOKIE_SECURE
        value: "true"

      # --- IDEMPOTENCY / COMMERCIAL ---
      - key: IDEMPOTENCY_KEY_TTL_HOURS
        value: "24"
      - key: CONTRACT_APPROVAL_THRESHOLD_AMOUNT
        value: "5000"
      - key: CONTRACT_REVIEW_LINK_TTL_HOURS
        value: "72"

      # --- STORAGE (Cloudflare R2) ---
      - key: STORAGE_PROVIDER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: DOCUMENT_SIGNING_SECRET
        generateValue: true
      - key: DOCUMENT_DOWNLOAD_URL_TTL_SECONDS
        value: "60"
      - key: DOCUMENT_MAX_SIZE_BYTES
        value: "26214400"

      # --- EMAIL ---
      - key: EMAIL_PROVIDER
        value: log # only implemented option today — see docs/DEPLOYMENT_ENV.md "Email"
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_API_KEY
        sync: false

      # --- JOBS / SCHEDULER (in-process, same service — no separate worker to define) ---
      - key: JOB_POLL_INTERVAL_MS
        value: "5000"
      - key: SCHEDULER_INTERVAL_MS
        value: "60000"

      # --- WEBHOOK ---
      - key: ESIGN_WEBHOOK_SECRET
        generateValue: true # regenerate to match whatever the real e-signature provider signs with, if/when one is connected
