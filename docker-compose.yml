name: abroad-scholarship-system

services:
  postgres:
    image: postgres:16-alpine
    container_name: abroad-scholarship-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: abroad_app
      POSTGRES_PASSWORD: abroad_app_dev_password
      POSTGRES_DB: abroad_scholarship_dev
    ports:
      - "55532:5432"
    volumes:
      - abroad_scholarship_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abroad_app -d abroad_scholarship_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  abroad_scholarship_pgdata:
    name: abroad_scholarship_pgdata
